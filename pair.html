<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING 🤴 - Code Pair</title>
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: gold;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,215,0,0.1);
            border-radius: 15px;
            border: 2px solid gold;
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }

        .crown {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px gold; }
            50% { text-shadow: 0 0 20px orange, 0 0 30px gold; }
        }

        .title {
            font-size: 2rem;
            margin-bottom: 30px;
            color: gold;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .phone-input {
            width: 300px;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid gold;
            border-radius: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            text-align: center;
        }

        .phone-input::placeholder {
            color: #ccc;
        }

        .submit-btn {
            background: gold;
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: orange;
            transform: scale(1.05);
        }

        .loading {
            display: none;
            margin-top: 20px;
            color: gold;
        }

        .spinner {
            border: 3px solid rgba(255,215,0,0.3);
            border-top: 3px solid gold;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Musique en arrière-plan -->
    <audio id="bgMusic" autoplay loop>
        <source src="https://files.catbox.moe/9snj0e.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="crown">👑</div>
        <div class="title">KING DIVIN - CODE PAIR</div>
        
        <form id="pairForm">
            <div class="input-group">
                <input 
                    type="tel" 
                    class="phone-input" 
                    placeholder="+509XXXXXXXX" 
                    required
                    pattern="^\+[0-9]{10,15}$"
                    title="Format: +509XXXXXXXX"
                >
            </div>
            <button type="submit" class="submit-btn">
                GÉNÉRER LE CODE
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Génération du code...</div>
        </div>
    </div>

    <script>
        // Lecture automatique de la musique
        document.addEventListener('click', function() {
            const music = document.getElementById('bgMusic');
            if (music.paused) {
                music.play().catch(e => console.log('Auto-play blocked'));
            }
        });

        // Gestion du formulaire
        document.getElementById('pairForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phoneInput = this.querySelector('.phone-input');
            const submitBtn = this.querySelector('.submit-btn');
            const loading = document.getElementById('loading');
            const phoneNumber = phoneInput.value.trim();

            // Validation basique
            if (!phoneNumber.match(/^\+[0-9]{10,15}$/)) {
                alert('Format invalide. Utilisez: +509XXXXXXXX');
                return;
            }

            // Afficher le loading
            submitBtn.disabled = true;
            loading.style.display = 'block';

            try {
                // Appel vers pair.js
                const response = await fetch(`/pair?number=${encodeURIComponent(phoneNumber)}`);
                const data = await response.json();

                if (data.code) {
                    alert(`✅ CODE GÉNÉRÉ: ${data.code}\n\nVérifiez vos messages WhatsApp!`);
                    phoneInput.value = '';
                } else {
                    throw new Error(data.error || 'Erreur inconnue');
                }

            } catch (error) {
                console.error('Erreur:', error);
                alert('❌ Erreur lors de la génération du code');
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // Format automatique du numéro
        document.querySelector('.phone-input').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9+]/g, '');
            if (!value.startsWith('+')) {
                value = '+' + value;
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
