<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING 🤴 - Légende Divine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a, #000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .crown {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px gold; }
            to { text-shadow: 0 0 20px gold, 0 0 30px orange; }
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            color: gold;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 3rem;
            font-style: italic;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .btn {
            background: linear-gradient(45deg, gold, orange);
            color: black;
            padding: 1rem 2rem;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255,215,0,0.4);
        }

        .footer {
            margin-top: 3rem;
            color: #888;
            font-size: 0.9rem;
        }

        .footer a {
            color: gold;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .title { font-size: 2rem; }
            .crown { font-size: 3rem; }
            .button-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="crown">👑</div>
        <h1 class="title">KING DIVIN</h1>
        <p class="subtitle">Légende Éternelle - Créé par Kervens Aubourg</p>
        
        <div class="button-grid">
            <a href="qr.html" class="btn">🌟 QR CODE SACRÉ</a>
            <a href="pair.html" class="btn">⚡ CODE D'UNION</a>
            <a href="https://github.com/kervens-king/KING/fork" class="btn" target="_blank">🎯 FORK LA LÉGENDE</a>
            <a href="https://whatsapp.com/channel/0029Vb6KikfLdQefJursHm20" class="btn" target="_blank">📢 CANAL ROYAL</a>
            <a href="https://wa.me/50942737567" class="btn" target="_blank">🛡️ SUPPORT DIVIN</a>
            <a href="status.html" class="btn">📊 STATUT CÉLESTE</a>
        </div>

        <div class="footer">
            <p>KING 🤴 &copy; 2024 | 
                <a href="https://github.com/kervens-king" target="_blank">Kervens Aubourg</a> - 
                Tous pouvoirs divins réservés
            </p>
        </div>
    </div>

    <!-- Musique -->
    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/9snj0e.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.addEventListener('click', function() {
            const music = document.getElementById('bgMusic');
            music.play().catch(e => console.log('Lecture automatique bloquée'));
        }, { once: true });

        document.querySelector('.footer p').innerHTML = 
            document.querySelector('.footer p').innerHTML.replace('2024', new Date().getFullYear());
    </script>
</body>
</html>
